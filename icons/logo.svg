<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".3" r=".85">
      <stop offset="0" stop-color="#8e3a5a"/><stop offset=".55" stop-color="#561d36"/><stop offset="1" stop-color="#2c0c1a"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".5">
      <stop offset="0" stop-color="#f1d39b" stop-opacity=".35"/><stop offset="1" stop-color="#f1d39b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe8bd"/><stop offset=".35" stop-color="#e2b768"/><stop offset=".7" stop-color="#b8863a"/><stop offset="1" stop-color="#f3d690"/>
    </linearGradient>
    <linearGradient id="goldv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc9f"/><stop offset="1" stop-color="#b8863a"/>
    </linearGradient>
    <linearGradient id="archfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a24a6c" stop-opacity=".55"/><stop offset="1" stop-color="#561d36" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf2"/><stop offset="1" stop-color="#f1e2cf"/>
    </linearGradient>
    <clipPath id="archclip"><path d="M134 372V214c0-38 40-58 74-68 30-9 42-30 48-54 6 24 18 45 48 54 34 10 74 30 74 68v158z"/></clipPath>
    <mask id="moon"><rect width="512" height="512" fill="#fff"/><circle cx="262" cy="47" r="11" fill="#000"/></mask>
    <path id="spark" d="M0-10C1-3 3-1 10 0 3 1 1 3 0 10-1 3-3 1-10 0-3-1-1-3 0-10z"/>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="240" r="200" fill="url(#glow)"/>

  <!-- sparkles -->
  <g fill="#f3d690">
    <use href="#spark" transform="translate(96 120) scale(1.1)" opacity=".9"/>
    <use href="#spark" transform="translate(420 150) scale(.8)" opacity=".8"/>
    <use href="#spark" transform="translate(440 250) scale(.55)" opacity=".7"/>
    <use href="#spark" transform="translate(70 230) scale(.5)" opacity=".6"/>
    <use href="#spark" transform="translate(380 70) scale(.5)" opacity=".7"/>
    <circle cx="140" cy="80" r="2.5" opacity=".7"/><circle cx="460" cy="190" r="2" opacity=".6"/><circle cx="52" cy="170" r="2" opacity=".6"/>
  </g>

  <!-- mihrab arch -->
  <path d="M134 372V214c0-38 40-58 74-68 30-9 42-30 48-54 6 24 18 45 48 54 34 10 74 30 74 68v158" fill="url(#archfill)"/>
  <path d="M118 380V212c0-48 48-72 86-82 26-7 40-24 52-58 12 34 26 51 52 58 38 10 86 34 86 82v168" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
  <path d="M136 376V216c0-36 38-56 72-65 28-8 40-27 48-48 8 21 20 40 48 48 34 9 72 29 72 65v160" fill="none" stroke="#e8c47e" stroke-opacity=".45" stroke-width="2.5"/>
  <circle cx="256" cy="52" r="13" fill="url(#gold)" mask="url(#moon)"/>
  <path d="M272 40l2 5 5 1-4 3 1 5-4-3-4 3 1-5-4-3 5-1z" fill="#f3d690"/>

  <g clip-path="url(#archclip)">
