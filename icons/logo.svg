    <path d="M140 372c2-64 26-98 72-104h10c46 6 70 40 72 104z" fill="url(#ivory)"/>
    <path d="M196 268l20 18 20-18" fill="none" stroke="#e6d2bd" stroke-width="3"/>
    <rect x="203" y="250" width="26" height="22" rx="6" fill="#efc2a0"/>
    <path d="M206 268h20v8l-10 6-10-6z" fill="#fff6ea" stroke="#e6d2bd" stroke-width="2"/>
    <circle cx="216" cy="288" r="2.8" fill="#d6a24e"/><circle cx="216" cy="302" r="2.8" fill="#d6a24e"/><circle cx="216" cy="316" r="2.8" fill="#d6a24e"/>
    <path d="M150 350c30-8 100-8 132 0v24H150z" fill="url(#gold)"/>
    <path d="M150 358c30-7 100-7 132 0" stroke="#8e5d22" stroke-opacity=".35" stroke-width="2" fill="none"/>
    <ellipse cx="216" cy="226" rx="31" ry="35" fill="#f2c7a6"/>
    <path d="M186 222c-2-18 6-30 30-31 24 1 32 13 30 31-4-8-10-12-30-12s-26 4-30 12z" fill="#2e2020"/>
    <ellipse cx="185" cy="230" rx="5" ry="8" fill="#e8b693"/><ellipse cx="247" cy="230" rx="5" ry="8" fill="#e8b693"/>
    <path d="M183 206l3-30c18-7 42-7 60 0l3 30c-20-5-46-5-66 0z" fill="#1d1418"/>
    <path d="M186 180c18-6 40-6 58 0" stroke="#3d2e36" stroke-width="3" fill="none"/>

    <!-- bride -->
    <path d="M232 372c2-60 22-96 66-104h12c44 8 66 44 68 104z" fill="url(#ivory)"/>
    <path d="M262 214c0-34 22-52 44-52s46 18 46 52l8 70c-18 14-36 18-54 18s-36-4-52-18z" fill="#fffaf3" stroke="#ecd9c4" stroke-width="2"/>
    <path d="M352 214l14 120c-8 10-18 14-26 14l-6-100z" fill="#fbefe4" opacity=".9"/>
    <ellipse cx="306" cy="232" rx="25" ry="30" fill="#f4cdb0"/>
    <path d="M276 226c2-28 16-40 30-40s28 12 30 40c-6-14-16-22-30-22s-24 8-30 22z" fill="#fffaf3"/>
    <path d="M272 196c14-16 54-16 68 0" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="306" cy="186" r="5.5" fill="url(#gold)"/><circle cx="288" cy="190" r="3" fill="#e9c27a"/><circle cx="324" cy="190" r="3" fill="#e9c27a"/>
    <path d="M270 282c20 12 52 12 72 0" fill="none" stroke="#ecd9c4" stroke-width="2"/>
  </g>

  <!-- heart -->
  <path d="M256 150c-6-10-22-8-22 4 0 10 14 18 22 24 8-6 22-14 22-24 0-12-16-14-22-4z" fill="url(#gold)"/>

  <!-- laurel left & right -->
  <g id="laurel" fill="url(#goldv)">
    <path d="M150 432C112 400 96 356 100 300" fill="none" stroke="#d6a24e" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="96" cy="314" rx="8" ry="19" transform="rotate(-20 96 314)"/><ellipse cx="116" cy="304" rx="7" ry="17" transform="rotate(30 116 304)"/>
    <ellipse cx="96" cy="350" rx="8" ry="19" transform="rotate(-35 96 350)"/><ellipse cx="122" cy="340" rx="7" ry="17" transform="rotate(25 122 340)"/>
    <ellipse cx="108" cy="386" rx="8" ry="19" transform="rotate(-50 108 386)"/><ellipse cx="134" cy="374" rx="7" ry="17" transform="rotate(15 134 374)"/>
    <ellipse cx="128" cy="414" rx="8" ry="19" transform="rotate(-62 128 414)"/>
  </g>
  <use href="#laurel" transform="translate(512 0) scale(-1 1)"/>

  <!-- ribbon -->
  <path d="M70 420c70-34 150-26 216-6 60 18 110 18 156-8-28 42-90 62-158 46-70-16-140-36-214-32z" fill="url(#gold)"/>
  <path d="M96 418c64-24 132-16 190 2" fill="none" stroke="#fff3d2" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>

  <!-- countdown calendar / checklist -->
  <g transform="rotate(-6 196 360)">
    <rect x="146" y="300" width="110" height="122" rx="16" fill="url(#ivory)" stroke="url(#gold)" stroke-width="6"/>
    <path d="M146 330v-14a16 16 0 0 1 16-16h78a16 16 0 0 1 16 16v14z" fill="#7a2f4c"/>
    <rect x="168" y="290" width="8" height="22" rx="4" fill="url(#goldv)"/><rect x="226" y="290" width="8" height="22" rx="4" fill="url(#goldv)"/>
    <path d="M162 350l7 7 13-14M162 376l7 7 13-14M162 402l7 7 13-14" fill="none" stroke="#7a2f4c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="192" y="345" width="48" height="8" rx="4" fill="#e8d3bd"/><rect x="192" y="371" width="48" height="8" rx="4" fill="#e8d3bd"/><rect x="192" y="397" width="36" height="8" rx="4" fill="#e8d3bd"/>
  </g>

  <!-- rings -->
  <ellipse cx="318" cy="394" rx="32" ry="29" fill="none" stroke="url(#gold)" stroke-width="11"/>
  <ellipse cx="360" cy="394" rx="32" ry="29" fill="none" stroke="url(#gold)" stroke-width="11"/>
  <path d="M340 370a32 29 0 0 1 3 46" fill="none" stroke="url(#gold)" stroke-width="11"/>
  <path d="M310 372q8-6 18-4" stroke="#fffbe8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M352 372q8-6 18-4" stroke="#fffbe8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g fill="#fbe8bd"><use href="#spark" transform="translate(402 352) scale(.9)"/><use href="#spark" transform="translate(296 364) scale(.45)"/></g>
</svg>
