<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Persediaan Kahwin</title>
<meta name="description" content="Rancang kos, simpanan, senarai semak dan tetamu untuk hari perkahwinan.">
<meta name="theme-color" content="#7a4b5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kahwin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6f2; --card:#ffffff; --ink:#2b2226; --muted:#8a7b80; --line:#eee4e0;
  --accent:#7a4b5c; --accent-soft:#f3e7ea; --gold:#b8935a; --ok:#4f7a5c; --warn:#b5603f;
  --radius:18px; --shadow:0 1px 2px rgba(60,30,40,.05),0 6px 20px rgba(60,30,40,.06);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1b1618;--card:#261f22;--ink:#f3ecee;--muted:#a8999e;--line:#3a2f33;
    --accent:#d9a3b4;--accent-soft:#3a2a30;--gold:#d8b77f;--ok:#8cc29b;--warn:#e89a7a;
    --shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 24px}
h1,h2,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;letter-spacing:.2px}
h1{font-size:30px;margin:0;line-height:1.1}
h2{font-size:22px;margin:22px 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;padding-top:env(safe-area-inset-top);margin-bottom:6px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;margin-bottom:12px}
.hero{text-align:center;padding:22px 16px;background:linear-gradient(160deg,var(--accent-soft),var(--card))}
.names{font-size:28px;margin:0 0 2px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 6px}
.cd div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 0}
.cd b{display:block;font-size:26px;font-variant-numeric:tabular-nums;color:var(--accent)}
.cd span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.ringrow{display:flex;gap:16px;align-items:center}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:600;font-size:22px}
.ring .pct small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.kv{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.kv span{color:var(--muted)} .kv b{font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .n{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.gold i{background:var(--gold)}
.list .row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.list .row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted)}
.row .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.row .amt small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.catHead{display:flex;justify-content:space-between;align-items:baseline}
.catHead h3{margin:0;font-size:15px}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;cursor:pointer}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.done .t{text-decoration:line-through;color:var(--muted)}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 16px;font:600 15px Inter,sans-serif;background:var(--accent);color:#fff;cursor:pointer;width:100%}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--line)}
.iconbtn{appearance:none;border:0;background:var(--accent-soft);color:var(--accent);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(96px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;font-size:28px;line-height:1;box-shadow:0 8px 24px rgba(122,75,92,.35);z-index:5}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;appearance:none;border:0;background:none;color:var(--muted);padding:10px 0 8px;font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--accent)}
nav svg{width:22px;height:22px}
.empty{text-align:center;color:var(--muted);padding:20px 8px;font-size:14px}
.seg{display:flex;background:var(--accent-soft);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font:500 13px Inter,sans-serif;color:var(--accent);cursor:pointer}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
/* sheet */
.mask{position:fixed;inset:0;background:rgba(20,10,15,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 12px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:500}
input,select,textarea{width:100%;font:15px Inter,sans-serif;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.actions{display:grid;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="btn fab hidden" id="fab" aria-label="Tambah">+</button>
<nav><div class="in" id="nav"></div></nav>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='kahwin-v1';
const CATS=['Mas Kahwin','Hantaran','Cincin','Dewan / Tempat','Katering','Pelamin & Dekorasi','Baju & Mak Andam','Jurugambar & Video','Kad & Cenderamata','Kursus & Dokumen','Lain-lain'];
const WHEN=['12 bulan sebelum','6 bulan sebelum','3 bulan sebelum','1 bulan sebelum','1 minggu sebelum','Hari majlis'];
const DEFAULT_TASKS=[
 ['Tetapkan tarikh & bajet kasar',0],['Merisik / bertunang',0],['Buka akaun simpanan khas kahwin',0],['Tempah dewan / tempat majlis',0],
 ['Hadiri kursus pra-perkahwinan',1],['Ujian saringan HIV',1],['Tempah katering',1],['Tempah jurugambar & videografi',1],['Tempah pelamin & mak andam',1],
 ['Hantar borang permohonan nikah',2],['Senarai tetamu muktamad',2],['Tempah baju nikah & sanding',2],['Cetak kad jemputan / e-kad',2],['Beli cincin',2],
 ['Edar kad jemputan',3],['Siapkan dulang hantaran',3],['Tempah cenderamata (doorgift)',3],['Fitting baju kali terakhir',3],
 ['Sahkan semua vendor & bayaran baki',4],['Sediakan sampul duit untuk vendor',4],['Rehat secukupnya',4],
 ['Bawa dokumen nikah & mas kahwin',5]
];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return s}catch(e){}
  return {settings:{n1:'',n2:'',date:'',time:'10:00',venue:''},costs:[],savings:[],guests:[],
    tasks:DEFAULT_TASKS.map(([t,w])=>({id:uid(),text:t,when:w,done:false}))};
}
let S=load(), tab=localStorage.getItem(KEY+'-tab')||'home', guestFilter='all';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Gagal simpan')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Math.max(0,parseFloat(v)||0);
const rm=n=>'RM '+num(n).toLocaleString('ms-MY',{minimumFractionDigits:0,maximumFractionDigits:2});
const fmtDate=d=>d?new Date(d+'T00:00').toLocaleDateString('ms-MY',{day:'numeric',month:'short',year:'numeric'}):'';
const sum=(a,f)=>a.reduce((t,x)=>t+num(f(x)),0);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}

const ICONS={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 cost:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/>',
 save:'<path d="M12 3v18M17 7.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2.2 2.8 5 3.5 5 1.6 5 3.5-2.2 3-5 3-5-1.1-5-3"/>',
 task:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
 guest:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.8 3 2.6 3.5 5.2"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const TABS=[['home','Utama'],['cost','Kos'],['save','Simpanan'],['task','Semak'],['guest','Tetamu']];

function renderNav(){
  document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${icon(k)}${l}</button>`).join('');
}
document.getElementById('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;try{localStorage.setItem(KEY+'-tab',tab)}catch(e){}render();scrollTo(0,0)};

function totals(){
  const est=sum(S.costs,c=>c.est), paid=sum(S.costs,c=>c.paid), saved=sum(S.savings,s=>s.amt);
  return {est,paid,saved,need:Math.max(0,est-saved),pct:est?Math.min(100,saved/est*100):0};
}
function target(){const s=S.settings;if(!s.date)return null;return new Date(s.date+'T'+(s.time||'00:00'))}

/* ---------- views ---------- */
function vHome(){
  const s=S.settings,T=totals(),tg=target();
  const names=(s.n1||s.n2)?`${esc(s.n1||'…')} <span style="color:var(--gold)">&amp;</span> ${esc(s.n2||'…')}`:'Hari Bahagia Kita';
  let months=null; if(tg){months=Math.max(1,Math.ceil((tg-new Date())/(30.44*864e5)))}
  const perMonth=months?T.need/months:0;
  const done=S.tasks.filter(t=>t.done).length;
  const pax=sum(S.guests,g=>g.pax||1), paxYes=sum(S.guests.filter(g=>g.status==='hadir'),g=>g.pax||1);
  const now=today();
  const due=S.costs.filter(c=>c.due&&num(c.est)-num(c.paid)>0).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,4);
  const r=50,C=2*Math.PI*r;
  return `
  <div class="top"><div><div class="sub">Persediaan Perkahwinan</div><h1>Assalamualaikum</h1></div>
   <button class="iconbtn" id="gear" aria-label="Tetapan">${icon('gear')}</button></div>
  <div class="card hero">
    <div class="names serif">${names}</div>
    <div class="sub">${tg?esc(tg.toLocaleDateString('ms-MY',{weekday:'long',day:'numeric',month:'long',year:'numeric'})):'Tetapkan tarikh majlis'}${s.venue?' · '+esc(s.venue):''}</div>
    ${tg?`<div class="cd" id="cd"></div>`:`<div style="margin-top:14px"><button class="btn" id="setDate">Tetapkan tarikh</button></div>`}
  </div>
  <div class="card">
    <div class="ringrow">
      <div class="ring"><svg width="118" height="118"><circle cx="59" cy="59" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/>
        <circle cx="59" cy="59" r="${r}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-T.pct/100)}" style="transition:stroke-dashoffset .6s"/></svg>
        <div class="pct"><div>${Math.round(T.pct)}%<small>terkumpul</small></div></div></div>
      <div style="flex:1">
        <div class="kv"><span>Terkumpul</span><b style="color:var(--ok)">${rm(T.saved)}</b></div>
        <div class="kv"><span>Jumlah kos</span><b>${rm(T.est)}</b></div>
        <div class="kv"><span>Baki perlu</span><b style="color:var(--warn)">${rm(T.need)}</b></div>
      </div>
    </div>
    ${months&&T.need>0?`<div class="sub" style="margin-top:10px;text-align:center">Simpan <b style="color:var(--ink)">${rm(Math.ceil(perMonth))}</b> sebulan untuk ${months} bulan lagi</div>`:''}
    ${T.est>0&&T.need===0?`<div class="sub" style="margin-top:10px;text-align:center;color:var(--ok)">Alhamdulillah, sasaran tercapai!</div>`:''}
  </div>
  <div class="grid2">
    <div class="card stat"><div class="l">Sudah dibayar ke vendor</div><div class="n">${rm(T.paid)}</div><div class="bar gold"><i style="width:${T.est?T.paid/T.est*100:0}%"></i></div></div>
    <div class="card stat"><div class="l">Senarai semak</div><div class="n">${done}/${S.tasks.length}</div><div class="bar"><i style="width:${S.tasks.length?done/S.tasks.length*100:0}%"></i></div></div>
    <div class="card stat"><div class="l">Tetamu dijemput</div><div class="n">${pax} pax</div></div>
    <div class="card stat"><div class="l">Sah hadir</div><div class="n">${paxYes} pax</div></div>
  </div>
  <h2>Bayaran akan datang</h2>
  <div class="card list">${due.length?due.map(c=>`<div class="row" data-cost="${c.id}"><div class="main"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.vendor||c.cat)}</div></div>
    <div class="amt">${rm(num(c.est)-num(c.paid))}<small><span class="pill ${c.due<now?'warn':''}">${c.due<now?'Lewat · ':''}${fmtDate(c.due)}</span></small></div></div>`).join(''):'<div class="empty">Tiada bayaran tertunggak. Letak "tarikh akhir bayar" pada item kos untuk peringatan.</div>'}</div>`;
}
function vCost(){
  const T=totals();
  const groups=CATS.map(cat=>({cat,items:S.costs.filter(c=>(c.cat||'Lain-lain')===cat)})).filter(g=>g.items.length);
  return `<div class="top"><div><div class="sub">Bajet</div><h1>Kos Perkahwinan</h1></div></div>
  <div class="card"><div class="kv"><span>Jumlah anggaran</span><b>${rm(T.est)}</b></div>
   <div class="kv"><span>Sudah dibayar</span><b style="color:var(--ok)">${rm(T.paid)}</b></div>
   <div class="kv"><span>Baki bayaran vendor</span><b style="color:var(--warn)">${rm(T.est-T.paid)}</b></div>
   <div class="bar gold"><i style="width:${T.est?T.paid/T.est*100:0}%"></i></div></div>
  ${groups.length?groups.map(g=>{const e=sum(g.items,c=>c.est),p=sum(g.items,c=>c.paid);return `
   <div class="card"><div class="catHead"><h3>${esc(g.cat)}</h3><span class="sub">${rm(e)}</span></div>
   <div class="bar gold" style="margin-bottom:4px"><i style="width:${e?p/e*100:0}%"></i></div>
   <div class="list">${g.items.map(c=>{const bal=num(c.est)-num(c.paid);return `<div class="row" data-cost="${c.id}"><div class="main"><div class="t">${esc(c.name)}</div>
     <div class="s">${esc(c.vendor||'')}${c.vendor&&c.due?' · ':''}${c.due?'Bayar sebelum '+fmtDate(c.due):''}</div></div>
     <div class="amt">${rm(c.est)}<small>${bal<=0?'<span class="pill ok">Selesai</span>':'Baki '+rm(bal)}</small></div></div>`}).join('')}</div></div>`}).join('')
  :'<div class="card empty">Belum ada item kos.<br>Tekan <b>+</b> untuk tambah (contoh: Katering 500 pax).</div>'}`;
}
function vSave(){
  const T=totals(), list=[...S.savings].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return `<div class="top"><div><div class="sub">Tabung</div><h1>Simpanan</h1></div></div>
  <div class="card"><div class="stat"><div class="l">Jumlah terkumpul</div><div class="n" style="font-size:30px;color:var(--ok)">${rm(T.saved)}</div></div>
   <div class="bar"><i style="width:${T.pct}%"></i></div>
   <div class="sub" style="margin-top:8px">${Math.round(T.pct)}% daripada ${rm(T.est)} · baki ${rm(T.need)}</div></div>
  <div class="card list">${list.length?list.map(s=>`<div class="row" data-save="${s.id}"><div class="main"><div class="t">${esc(s.note||'Simpanan')}</div><div class="s">${fmtDate(s.date)}${s.who?' · '+esc(s.who):''}</div></div><div class="amt" style="color:var(--ok)">+${rm(s.amt)}</div></div>`).join('')
  :'<div class="empty">Rekod setiap kali anda menabung atau terima sumbangan.<br>Tekan <b>+</b> untuk tambah.</div>'}</div>`;
}
function vTask(){
  const done=S.tasks.filter(t=>t.done).length;
  return `<div class="top"><div><div class="sub">${done} daripada ${S.tasks.length} selesai</div><h1>Senarai Semak</h1></div></div>
  <div class="card"><div class="bar"><i style="width:${S.tasks.length?done/S.tasks.length*100:0}%"></i></div></div>
  ${WHEN.map((w,i)=>{const items=S.tasks.filter(t=>(t.when??0)==i);if(!items.length)return'';return `<div class="card"><div class="catHead"><h3>${w}</h3><span class="sub">${items.filter(t=>t.done).length}/${items.length}</span></div>
   <div class="list">${items.map(t=>`<div class="row ${t.done?'done':''}" data-task="${t.id}"><div class="chk ${t.done?'on':''}" data-toggle="${t.id}">${t.done?'✓':''}</div><div class="main"><div class="t">${esc(t.text)}</div></div></div>`).join('')}</div></div>`}).join('')}`;
}
function vGuest(){
  const f=guestFilter, by=k=>S.guests.filter(g=>k==='all'||g.side===k);
  const list=by(f), st={hadir:'ok',tidak:'warn'};
  const pax=a=>sum(a,g=>g.pax||1);
  return `<div class="top"><div><div class="sub">${pax(S.guests)} pax · ${S.guests.length} jemputan</div><h1>Tetamu</h1></div></div>
  <div class="grid2">
   <div class="card stat"><div class="l">Pihak lelaki</div><div class="n">${pax(by('lelaki'))} pax</div></div>
   <div class="card stat"><div class="l">Pihak perempuan</div><div class="n">${pax(by('perempuan'))} pax</div></div>
  </div>
  <div class="seg" id="gseg">${[['all','Semua'],['lelaki','Lelaki'],['perempuan','Perempuan']].map(([k,l])=>`<button class="${f===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div>
  <div class="card list">${list.length?list.map(g=>`<div class="row" data-guest="${g.id}"><div class="main"><div class="t">${esc(g.name)}</div><div class="s">${g.side==='lelaki'?'Pihak lelaki':'Pihak perempuan'}${g.phone?' · '+esc(g.phone):''}</div></div>
   <div class="amt">${num(g.pax)||1} pax<small><span class="pill ${st[g.status]||''}">${g.status==='hadir'?'Hadir':g.status==='tidak'?'Tidak hadir':'Belum jawab'}</span></small></div></div>`).join('')
  :'<div class="empty">Belum ada tetamu. Tekan <b>+</b> untuk tambah keluarga / kawan.</div>'}</div>`;
}

let cdTimer;
function tick(){
  const el=document.getElementById('cd'),tg=target();if(!el||!tg)return;
  let d=Math.max(0,tg-new Date());
  if(d===0){el.outerHTML='<div class="serif" style="font-size:24px;margin-top:14px;color:var(--accent)">Selamat Pengantin Baru!</div>';return}
  const D=Math.floor(d/864e5),H=Math.floor(d/36e5)%24,M=Math.floor(d/6e4)%60,Sx=Math.floor(d/1e3)%60;
  el.innerHTML=[[D,'Hari'],[H,'Jam'],[M,'Minit'],[Sx,'Saat']].map(([n,l])=>`<div><b>${String(n).padStart(2,'0')}</b><span>${l}</span></div>`).join('');
}

function render(){
  renderNav();
  const v={home:vHome,cost:vCost,save:vSave,task:vTask,guest:vGuest}[tab]||vHome;
  document.getElementById('app').innerHTML=v();
  document.getElementById('fab').classList.toggle('hidden',tab==='home');
  clearInterval(cdTimer);if(tab==='home'){tick();cdTimer=setInterval(tick,1000)}
}

/* ---------- forms ---------- */
function openForm(title,fields,val,onSave,onDel,extra=''){
  const sh=document.getElementById('sheet');
  sh.innerHTML=`<h2>${title}</h2><form id="f">${fields.map(f=>`<label for="f_${f.k}">${f.l}</label>${
    f.t==='select'?`<select id="f_${f.k}" name="${f.k}">${f.o.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(val[f.k]??f.d??'')===String(v)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`
    :`<input id="f_${f.k}" name="${f.k}" type="${f.t||'text'}" ${f.t==='number'?'inputmode="decimal" step="any" min="0"':''} ${f.req?'required':''} placeholder="${esc(f.p||'')}" value="${esc(val[f.k]??f.d??'')}">`}`).join('')}
   ${extra}<div class="actions"><button class="btn" type="submit">Simpan</button>${onDel?'<button class="btn danger" type="button" id="del">Padam</button>':''}<button class="btn ghost" type="button" id="cancel">Batal</button></div></form>`;
  document.getElementById('mask').classList.add('show');
  document.getElementById('f').onsubmit=e=>{e.preventDefault();const o={};new FormData(e.target).forEach((v,k)=>o[k]=v.trim());onSave(o);save();close();render()};
  document.getElementById('cancel').onclick=close;
  if(onDel)document.getElementById('del').onclick=()=>{if(confirm('Padam item ini?')){onDel();save();close();render();toast('Dipadam')}};
}
function close(){document.getElementById('mask').classList.remove('show')}
document.getElementById('mask').onclick=e=>{if(e.target.id==='mask')close()};

const upsert=(arr,item)=>{const i=arr.findIndex(x=>x.id===item.id);i<0?arr.push(item):arr[i]=item};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function formCost(c={}){openForm(c.id?'Kemaskini kos':'Tambah kos',[
  {k:'name',l:'Nama item',req:1,p:'cth: Katering 500 pax'},{k:'cat',l:'Kategori',t:'select',o:CATS,d:'Lain-lain'},
  {k:'est',l:'Kos anggaran (RM)',t:'number',req:1},{k:'paid',l:'Sudah dibayar (RM)',t:'number',d:0},
  {k:'vendor',l:'Vendor / kedai',p:'Pilihan'},{k:'phone',l:'No. telefon vendor',t:'tel',p:'Pilihan'},
  {k:'due',l:'Tarikh akhir bayar',t:'date'}],c,o=>{upsert(S.costs,{...c,...o,id:c.id||uid(),est:num(o.est),paid:num(o.paid)});toast('Disimpan')},
  c.id&&(()=>S.costs=S.costs.filter(x=>x.id!==c.id)),
  c.phone?`<a class="btn ghost" style="display:block;text-align:center;text-decoration:none;margin-top:12px" href="https://wa.me/${esc(String(c.phone).replace(/\D/g,'').replace(/^0/,'60'))}" target="_blank" rel="noopener">WhatsApp vendor</a>`:'')}
function formSave(s={}){openForm(s.id?'Kemaskini simpanan':'Tambah simpanan',[
  {k:'amt',l:'Jumlah (RM)',t:'number',req:1},{k:'date',l:'Tarikh',t:'date',d:today()},
  {k:'note',l:'Catatan',p:'cth: Gaji Disember / Duit ASB'},{k:'who',l:'Daripada',p:'cth: Saya / Tunang / Mak ayah'}],s,
  o=>{upsert(S.savings,{...s,...o,id:s.id||uid(),amt:num(o.amt)});toast('Simpanan direkod')},s.id&&(()=>S.savings=S.savings.filter(x=>x.id!==s.id)))}
function formTask(t={}){openForm(t.id?'Kemaskini tugasan':'Tambah tugasan',[
  {k:'text',l:'Tugasan',req:1},{k:'when',l:'Bila',t:'select',o:WHEN.map((w,i)=>[i,w]),d:0}],t,
  o=>upsert(S.tasks,{...t,...o,id:t.id||uid(),when:+o.when,done:!!t.done}),t.id&&(()=>S.tasks=S.tasks.filter(x=>x.id!==t.id)))}
function formGuest(g={}){openForm(g.id?'Kemaskini tetamu':'Tambah tetamu',[
  {k:'name',l:'Nama / keluarga',req:1,p:'cth: Keluarga Pak Long'},{k:'side',l:'Pihak',t:'select',o:[['lelaki','Pihak lelaki'],['perempuan','Pihak perempuan']],d:'perempuan'},
  {k:'pax',l:'Bilangan pax',t:'number',d:1},{k:'phone',l:'No. telefon',t:'tel',p:'Pilihan'},
  {k:'status',l:'RSVP',t:'select',o:[['belum','Belum jawab'],['hadir','Hadir'],['tidak','Tidak hadir']],d:'belum'}],g,
  o=>upsert(S.guests,{...g,...o,id:g.id||uid(),pax:Math.max(1,Math.round(num(o.pax)))}),g.id&&(()=>S.guests=S.guests.filter(x=>x.id!==g.id)))}
function formSettings(){
  openForm('Tetapan',[{k:'n1',l:'Nama pengantin lelaki'},{k:'n2',l:'Nama pengantin perempuan'},
   {k:'date',l:'Tarikh majlis',t:'date'},{k:'time',l:'Masa',t:'time'},{k:'venue',l:'Lokasi',p:'cth: Dewan Seri Melati'}],S.settings,
   o=>{S.settings={...S.settings,...o};toast('Tetapan disimpan')},null,
   `<label>Sandaran data</label><div class="grid2"><button type="button" class="btn ghost" id="exp">Eksport</button><button type="button" class="btn ghost" id="imp">Import</button></div>
    <input type="file" id="impf" accept="application/json" class="hidden">
    <div class="sub" style="margin-top:6px">Data disimpan dalam telefon ini sahaja. Eksport untuk sandaran atau pindah ke telefon pasangan.</div>`);
  document.getElementById('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='persediaan-kahwin-'+today()+'.json';a.click()};
  document.getElementById('imp').onclick=()=>document.getElementById('impf').click();
  document.getElementById('impf').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!d.settings||!Array.isArray(d.costs))throw 0;
    if(confirm('Gantikan semua data sekarang dengan fail ini?')){S={savings:[],guests:[],tasks:[],...d};save();close();render();toast('Data diimport')}}catch(_){toast('Fail tidak sah')}};
}

document.getElementById('fab').onclick=()=>({cost:formCost,save:formSave,task:formTask,guest:formGuest}[tab]||(()=>{}))();
document.getElementById('app').onclick=e=>{
  const q=s=>e.target.closest(s);let el;
  if(q('#gear')||q('#setDate'))return formSettings();
  if(el=q('[data-toggle]')){const t=S.tasks.find(x=>x.id===el.dataset.toggle);t.done=!t.done;save();render();return}
  if(el=q('[data-cost]'))return formCost(S.costs.find(x=>x.id===el.dataset.cost));
  if(el=q('[data-save]'))return formSave(S.savings.find(x=>x.id===el.dataset.save));
  if(el=q('[data-task]'))return formTask(S.tasks.find(x=>x.id===el.dataset.task));
  if(el=q('[data-guest]'))return formGuest(S.guests.find(x=>x.id===el.dataset.guest));
  if(el=q('#gseg button')){guestFilter=el.dataset.f;render()}
};

render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
